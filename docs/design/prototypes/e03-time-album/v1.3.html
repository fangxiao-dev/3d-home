<script>
'use strict';
(async function bootAlbum(){
 const response=await fetch('../../../../godot/content/album/album.json');if(!response.ok)throw new Error('album.json failed to load');const album=await response.json();
 const ASSETS=album.assets;
 const pages=album.pages;const pastStarClusters=album.quarters.filter(q=>q.count>0).map(q=>({time:q.time,count:q.count,label:`${q.year} 年第 ${q.quarter} 季度`}));
 const realStars=album.real_stars;const callHours=album.call_hours;
const $=s=>document.querySelector(s);
const tag=(s)=>`<span class="small-cap">${s}</span>`;
const headerLine=(eyebrow,folio)=>`<div class="page-top"><span class="eyebrow">${eyebrow}</span><span class="folio">${folio}</span></div>`;
const img=(asset,caption='',css='',h='179px')=>`<div class="photo-card" style="--rot:${css};--imgH:${h}"><div class="image-box"><img src="${ASSETS[asset]}" alt="${caption || '演示素材'}"></div><div class="photo-caption">${caption}</div></div>`;
const blank=(subtitle)=>`<div class="frame-empty"><div class="inside"><span>✳</span><strong>这一刻没有照片</strong><div>${subtitle}</div></div></div>`;
const foot=(t)=>`<div class="footnote">${t}</div>`;
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function assetUrl(key){const path=album.assets[key]||'';return path.startsWith('res://')?'../../../../godot/'+path.slice(6):''}
function renderBlock(block,page,spread){
 const text=esc(block.text||'').replace(/\n/g,'<br>'),cls=esc(block.class_name||''),style=block.style?` style="${esc(block.style)}"`:'';
 switch(block.type){
  case 'heading':return `<h${block.level===3?3:2}${style}>${text}</h${block.level===3?3:2}>`;
  case 'text':return `<p class="${cls}"${style}>${text}</p>`;
  case 'note':
   if(cls.includes('wedding-banner')){const bits=(block.text||'').split(/\s+/);return `<div class="wedding-banner"><div class="xi">${esc(bits.shift()||'囍')}</div><small>${esc(bits.join(' '))}</small></div>`}
   return `<div class="${cls||'hand-note'}"${style}>${text}</div>`;
  case 'quote':return `<div class="quote"${style}>${text}</div>`;
  case 'blank':return `<div class="frame-empty ${esc(block.variant||'')}"${style}><div class="inside"><span>✳</span><strong>这一刻没有照片</strong><div>${text}</div></div></div>`;
  case 'photo':return `<div class="photo-card"${style}><div class="image-box"><img src="${esc(assetUrl(block.asset))}" alt="${esc(block.caption||'示意素材')}"></div><div class="photo-caption">${esc(block.caption||'')}</div></div>`;
  default:return '';
 }
}
function content(p){return p.spreads.map((spread,index)=>{
 const photos=spread.blocks.filter(b=>b.type==='photo');let body=spread.blocks.map(b=>renderBlock(b,p,spread)).join('');
 if(spread.layout==='collage'&&photos.length>1){let inserted=false;body=spread.blocks.map(b=>{if(b.type!=='photo')return renderBlock(b,p,spread);if(inserted)return '';inserted=true;return `<div class="photo-overlap">${photos.map(photo=>renderBlock(photo,p,spread)).join('')}</div>`}).join('')}
 return `${headerLine(spread.eyebrow,String(index+pageNumber(p)).padStart(2,'0'))}<div class="page-content">${body}</div>`;
 })}
function pageNumber(p){return pages.indexOf(p)*2+1}
function yearX(t){return 48+(Math.min(2027.5,Math.max(2016,t))-2016)*79.5}
function monthX(m){return 56+(Math.min(13,Math.max(1,m))-1)*73.4}
function starCount(n){return n<=4?1:n<=14?2:n<=29?3:n<=49?4:5}
function starClusterSvg(c,i){
 const x=yearX(c.time),y=56+(i%3-1)*1.6,n=starCount(c.count);
 const dots=Array.from({length:n},(_,j)=>{
   const a=j*2.3999632297+i*.72;
   const r=j===0?0:2.8+Math.sqrt(j)*3.8;
   const dx=Math.cos(a)*r,dy=Math.sin(a)*r*.72;
   const size=(j===0?2:1.15)+(c.count>=30?.3:0);
   return `<circle class="star-dot" cx="${(x+dx).toFixed(2)}" cy="${(y+dy).toFixed(2)}" r="${size}"/>`;
 }).join('');
 const halo=4+Math.sqrt(c.count)*.94;
 return `<g class="star-group" data-star="${i}" data-time="${c.time}" aria-label="${c.label}，有互动记录"><title>${c.label} · 朋友圈互动（按发布日期归档）</title><circle class="star-halo" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${halo.toFixed(1)}"/>${dots}</g>`;
}
function nodeSvg(p,i,x,y,opts=''){return `<g class="timeline-node ${p.draft?'draft':''} ${opts}" data-index="${i}" tabindex="0" role="button" aria-label="跳转 ${p.title}"><circle cx="${x.toFixed(1)}" cy="${y}" r="6.2"/><title>${p.date} · ${p.short}${p.draft?'（年份待确认）':''}</title></g>`}
function chatStarsSvg(){return realStars.map((star,i)=>{const x=yearX(star.t),shape=i===0?`<path d="M${x} 45l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>`:`<path d="M${x} 45l2.3 7.7 7.7 2.3-7.7 2.3L${x} 65l-2.3-7.7L${x-8} 55l7.7-2.3z"/>`;return `<g class="chat-star" tabindex="0" role="img" aria-label="${esc(star.label)}"><title>${esc(star.label)}</title>${shape}</g>`}).join('')}
function footstepsSvg(detail=false){return album.footsteps.filter(f=>detail?f.month!=null:f.time<2026).map(f=>{const x=detail?monthX(f.month):yearX(f.time),y=f.who==='ying'?88:detail?35:92;return `<g class="footstep" aria-hidden="true"><title>${esc(f.label)}</title><ellipse cx="${x-2.2}" cy="${y}" rx="1.3" ry="2.1"/><ellipse cx="${x+2.2}" cy="${y-2.7}" rx="1.3" ry="2.1"/></g>`}).join('')}
function overviewSvg(){
 const stars=pastStarClusters.map((c,i)=>starClusterSvg(c,i)).join('')+chatStarsSvg()+footstepsSvg();
 const nodes=pages.map((p,i)=>p.time<2026?nodeSvg(p,i,yearX(p.time),(p.side||'both')==='fang'?31:(p.side||'both')==='ying'?83:57):'').join('');
 return `<svg viewBox="0 0 1000 123" preserveAspectRatio="none" aria-label="2016 到 2026 的双轨时间轴"><path class="life-track" data-track="fang" d="M48 58 C87 58 92 31 130 31 L686 31 Q755 31 784 51 Q814 68 854 49 L962 47" stroke="#be9569" stroke-width="3.5" fill="none" stroke-linecap="round"/><path class="life-track" data-track="ying" d="M48 58 C87 58 92 83 130 83 L686 83 Q755 83 784 64 Q814 50 854 71 L962 73" stroke="#c7858f" stroke-width="3.5" fill="none" stroke-linecap="round"/>${stars}${nodes}${nodeSvg(pages.find(p=>p.kind==='dayone'),pages.findIndex(p=>p.kind==='dayone'),yearX(2026.05),58,'zoom-node')}<g class="time-pointer" id="overviewCursor"><line x1="0" y1="6" x2="0" y2="91"/><circle cx="0" cy="57" r="5.5"/></g><g class="timeline-ticks">${[2016,2017,2018,2020,2022,2024,2025,2026].map(y=>`<text x="${yearX(y)}" y="117" text-anchor="middle">${y}</text>`).join('')}</g></svg>`
}
function stitchesSvg(top,bottom){const yAt=(points,m)=>{for(let i=1;i<points.length;i++){if(m<=points[i][0]){const a=points[i-1],b=points[i],t=(m-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}}return points.at(-1)[1]};return Object.entries(callHours).filter(([m,h])=>Number(m)<9&&Number(h)>0).map(([month,h])=>{const x=monthX(Number(month)),a=yAt(top,Number(month)),b=yAt(bottom,Number(month)),n=Math.min(5,Math.max(1,Math.round(Math.sqrt(Number(h))/3)));return Array.from({length:n},(_,i)=>{const y=a+(b-a)*(i+1)/(n+1);return `<path class="stitch" d="M${x-1.7} ${y-1.5}l3.4 3"/>`}).join('')}).join('')}
function detailSvg(){
 const trackTop=album.tracks.top;
 const bottom=album.tracks.bottom;
 const points=(a)=>a.map(([m,y])=>`${monthX(m)},${y}`).join(' ');
 const nodes=pages.map((p,i)=>p.month?nodeSvg(p,i,monthX(p.month),p.kind==='firstmeet'||p.kind==='travel'||p.kind==='proposal'||p.kind==='marriage'?62:66):'').join('');const stitches=stitchesSvg(trackTop,bottom);
 return `<svg viewBox="0 0 1000 123" preserveAspectRatio="none" aria-label="2026 年月份放大时间轴"><polyline class="life-track" data-track="fang" points="${points(trackTop)}" stroke="#be9569" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline class="life-track" data-track="ying" points="${points(bottom)}" stroke="#c7858f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M${monthX(2)} 64L${monthX(2.25)} 64 M${monthX(9)} 62L${monthX(10.6)} 62" fill="none" stroke="#f0e3c7" stroke-width="2"/>${stitches}${nodes}${footstepsSvg(true)}<g class="time-pointer" id="detailCursor"><line x1="0" y1="6" x2="0" y2="92"/><circle cx="0" cy="64" r="5.5"/></g><g class="timeline-ticks">${[1,2,3,5,7,9,10,11,12].map(m=>`<text x="${monthX(m)}" y="117" text-anchor="middle">${m}月</text>`).join('')}<text x="${monthX(13)}" y="117" text-anchor="middle">未来</text></g></svg>`
}
let pageIndex=0,turnBusy=false,curOverview=yearX(pages[0].time),curDetail=monthX(1),cursorFrame=0,starTimers=[];
function animateCursor(id,from,to){
 cancelAnimationFrame(cursorFrame);const el=$('#'+id);if(!el)return;const start=performance.now();
 function step(now){const t=Math.min(1,(now-start)/760),e=1-Math.pow(1-t,3);el.setAttribute('transform',`translate(${(from+(to-from)*e).toFixed(2)} 0)`);if(t<1)cursorFrame=requestAnimationFrame(step)}
 cursorFrame=requestAnimationFrame(step);
}
function flashStar(i){
 const n=document.querySelector(`[data-star="${i}"]`);
 if(n){n.classList.remove('flash');void n.getBoundingClientRect();n.classList.add('flash')}
}
function glintBetween(from,to){
 starTimers.forEach(clearTimeout);starTimers=[];
 if(from>=2026&&to>=2026)return;
 const relevant=pastStarClusters.map((c,i)=>({t:c.time,i})).filter(({t})=>t>=Math.min(from,to)&&t<=Math.max(from,to));
 if(to<from)relevant.reverse();
 relevant.forEach(({i},idx)=>starTimers.push(setTimeout(()=>flashStar(i),Math.round(idx*700/Math.max(relevant.length,1)))));
}
function renderIndex(){ $('#indexList').innerHTML=pages.map((p,i)=>`<button class="index-item ${i===pageIndex?'current':''}" data-jump="${i}"><small>${p.date}${p.draft?' · 日期待核实':''}</small><b>${String(i+1).padStart(2,'0')}　${p.short}</b></button>`).join('');}
function render(immediate=false){
 const p=pages[pageIndex],parts=content(p),isDetail=p.time>=2026;
 $('#leftPage').innerHTML=parts[0];$('#rightPage').innerHTML=parts[1];
 $('#chapterTab').textContent=`CHAPTER ${String(pageIndex+1).padStart(2,'0')}`;
 $('#currentTitle').textContent=p.title;$('#currentTag').textContent=p.tag;
 $('#pageCount').textContent=`${String(pageIndex+1).padStart(2,'0')} / ${pages.length}`;$('#dateBadge').textContent=p.date;
 $('#prev').disabled=pageIndex===0;$('#next').disabled=pageIndex===pages.length-1;
 $('#zoomMode').textContent=isDetail?'2026 局部放大 · 月份 / 相聚':'十年远景 · 2016—2025';
 $('#overviewLayer').classList.toggle('active',!isDetail);$('#detailLayer').classList.toggle('active',isDetail);
 document.querySelectorAll('.timeline-node').forEach(n=>n.classList.toggle('active',Number(n.dataset.index)===pageIndex));const side=p.side||'both';document.querySelectorAll('.life-track').forEach(t=>{const active=side==='both'||t.dataset.track===side;t.classList.toggle('active',active);t.classList.toggle('inactive',!active)});
 if(immediate){$('#overviewCursor').setAttribute('transform',`translate(${curOverview} 0)`);$('#detailCursor').setAttribute('transform',`translate(${curDetail} 0)`)}
 renderIndex();
}
function go(next){
 if(turnBusy||next<0||next>=pages.length||next===pageIndex)return;
 const previous=pages[pageIndex],upcoming=pages[next];turnBusy=true;
 glintBetween(previous.time,upcoming.time);
 const newOverview=yearX(Math.min(upcoming.time,2026.07)),newDetail=monthX(upcoming.month||1);
 animateCursor(upcoming.time>=2026?'detailCursor':'overviewCursor',upcoming.time>=2026?curDetail:curOverview,upcoming.time>=2026?newDetail:newOverview);
 curOverview=newOverview;curDetail=newDetail;
 $('#spread').classList.add('is-turning');
 setTimeout(()=>{pageIndex=next;render(false)},170);
 setTimeout(()=>{$('#spread').classList.remove('is-turning');turnBusy=false},510);
}
function replayStars(){
 if(pages[pageIndex].time>=2026){go(4);setTimeout(()=>{if(pageIndex===4)replayStars()},700);return}
 starTimers.forEach(clearTimeout);starTimers=[];
 pastStarClusters.forEach((c,i)=>starTimers.push(setTimeout(()=>flashStar(i),i*95)));
}
$('#overviewLayer').innerHTML=overviewSvg();$('#detailLayer').innerHTML=detailSvg();
$('#prev').addEventListener('click',()=>go(pageIndex-1));$('#next').addEventListener('click',()=>go(pageIndex+1));
$('#indexOpen').addEventListener('click',()=>{$('#indexOverlay').classList.add('show');renderIndex()});
$('#indexClose').addEventListener('click',()=>$('#indexOverlay').classList.remove('show'));
$('#indexOverlay').addEventListener('click',(e)=>{if(e.target.id==='indexOverlay')$('#indexOverlay').classList.remove('show')});
$('#indexList').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;$('#indexOverlay').classList.remove('show');go(Number(b.dataset.jump))});
$('#starReplay').addEventListener('click',replayStars);
$('.timeline-view').addEventListener('click',e=>{const n=e.target.closest('[data-index]');if(n)go(Number(n.dataset.index))});
$('.timeline-view').addEventListener('keydown',e=>{const n=e.target.closest('[data-index]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(Number(n.dataset.index))}});
document.addEventListener('keydown',e=>{if($('#indexOverlay').classList.contains('show')){if(e.key==='Escape')$('#indexOverlay').classList.remove('show');return}if(e.key==='ArrowLeft')go(pageIndex-1);if(e.key==='ArrowRight')go(pageIndex+1)});
let touchX=null;$('#spread').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});$('#spread').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>60)go(pageIndex+(dx<0?1:-1));touchX=null},{passive:true});
render(true);

})();
</script>
</body>
</html>
