    `${headerLine('2017 → 2024 → 2025','04')}<div class="page-content"><div class="date-tag">2017 · 德国</div><h2>当时只道<br>是寻常。</h2><p>离开、回望、重新选择。多年前一个普通的冬夜，后来在另一段人生里重新获得了意义。</p><div style="display:flex;align-items:center;gap:15px;margin-top:7px;max-height:160px;">${img('tree2024','多年后，又见那棵树','4deg','125px')}<div style="max-width:150px"><span class="hand-note">她懂得，</span><p class="text-sm">这不仅仅是一棵圣诞树。</p></div></div>${foot('这一页关于理解一个人的人生，不是“命中注定”的证明。')}</div>`];
  case 'africa': return [
    `${headerLine('TWO LIVES · A','05')}<div class="page-content"><div class="date-tag">同一个年份 · 日期待核实</div>${img('work','放仔 · 当年的生活 / 示意插画','-3deg','200px')}<div class="hand-note" style="align-self:flex-end;margin:8px 12px">那一年，我在……</div></div>`,
    `${headerLine('TWO LIVES · B','06')}<div class="page-content"><div class="date-tag">世界的另一端</div>${img('africa','莹仔 · 非洲外派 / 示意插画','4deg','200px')}<p class="tiny-script" style="margin-top:12px">当时的我们，大概并不知道彼此正在经历怎样的日子。</p>${foot('原型将年份暂放在 2020 附近，正式时间及两人照片都待确认。')}</div>`];
  case 'guzheng': return [
    `${headerLine('TWO LIVES · C','07')}<div class="page-content"><div class="date-tag">某年 · 年份待核实</div>${img('guzheng','莹仔 · 琴行与古筝 / 示意插画','-2deg','203px')}<p>后来她回国，在琴行教了一年的古筝。</p></div>`,
    `${headerLine('TWO LIVES · D','08')}<div class="page-content"><div class="date-tag">同一年，你在做什么？</div>${img('city','放仔 · 同年生活 / 示意插画','3deg','203px')}<p>可以找到一张你的照片。两张照片不必相似，真实的不同就很好。</p>${foot('此单元在时间轴上的位置仅是演示，不代表已核实的年份。')}</div>`];
  case 'reconnect': return [
    `${headerLine('NOVEMBER · 2025','09')}<div class="page-content"><div class="date-tag">2025 · 11.13</div><h2>那些疏密不同的星群，</h2><p>那些年，朋友圈里留下的点赞比想象中还多。却直到后来，我们才真正聊起彼此的生活。</p><div style="font-size:64px;letter-spacing:22px;color:#bf9b69;text-align:center;margin:13px 0">✧ ✦ ✧</div><p class="tiny-script">直到有一天，一个小小的回应，接上了一段真正的对话。</p></div>`,
    `${headerLine('THE NIGHT WE RECONNECTED','10')}<div class="page-content"><div class="chat her"><time>夜里</time>又是一个时差党</div><div class="chat him"><time>那一晚</time>一场比想象中更长的聊天。</div><div class="rule"></div><h3>重新连接</h3><p>起初没有人知道，这一次联系，会把两个人带到哪里。</p><div class="memo" style="margin-top:12px"><p>以前是「大兄弟」。<br>后来变成了「老公」「老婆」。</p></div>${foot('这里的对白仅选用已有记录中的短句；正式页面仍需核对。')}</div>`];
  case 'dayone': return [
    `${headerLine('DAY ONE · THE FIRST BLANK','11')}<div class="page-content"><div class="date-tag">2026 · JANUARY 01</div>${blank('跨年那通视频，忘了截图。')}<span class="hand-note" style="align-self:flex-end;margin-right:24px">明明很重要呀。</span></div>`,
    `${headerLine('A MOMENT WITHOUT A PHOTO','12')}<div class="page-content"><h2>有些瞬间，<br>忙着幸福就忘了拍。</h2><div class="rule"></div><div class="chat her"><time>后来</time>刚刚视频忘了截图</div><p>我们都喜欢留下照片和视频。但那个重要的夜晚，最重要的画面留在了记忆里。</p><p class="tiny-script">这不是一张缺失的证据，<br>而是一段确实发生的生活。</p>${foot('完整的《Day One》仍在书房的情书文集里。')}</div>`];
  case 'firstmeet': return [
    `${headerLine('FEBRUARY · TOGETHER AT LAST','13')}<div class="page-content"><div class="date-tag">2026 · 02</div><h2>终于，见到你。</h2><div class="photo-overlap">${img('couple','第一次见面 / 示意插画','','166px')}${img('skyGold','那一天的晚霞 / 示意插画','','166px')}</div></div>`,
    `${headerLine('THE FIRST REAL EMBRACE','14')}<div class="page-content"><h3>线上喜欢的那个人，<br>在现实里真的存在。</h3><p>没有一场特别盛大的初次约会。下班后的相见、散步、一起吃饭，还有一点点不真实感。</p><div class="memo" style="margin:17px 0"><div class="small-cap">一个特别的普通日子</div><p>原来第一次见面，也可以像已经认识很久的人一样，自然地走进生活。</p></div>${foot('待用真实的第一次线下相处照片替换。')}</div>`];
  case 'skies': return [
    `${headerLine('OUR TWO SKIES · WEST','15')}<div class="page-content"><div class="date-tag">2026 · 异地的时候</div>${img('skyBlue','德国 · 今天的天空 / 示意插画','-3deg','178px')}<p class="tiny-script">这是我这边的天空。</p></div>`,
    `${headerLine('OUR TWO SKIES · EAST','16')}<div class="page-content"><div class="date-tag">一张照片也能靠近彼此</div>${img('skyGold','宜昌 · 给你的晚霞 / 示意插画','3deg','178px')}<div class="quote" style="font-size:13px">“是只给老公的晚霞吗？”<br>“当然啦！”</div>${foot('和相识前的双页不同：这一次，两张照片是主动分享给彼此的。')}</div>`];
  case 'travel': return [
    `${headerLine('A YEAR OF LITTLE DAYS','17')}<div class="page-content"><div class="date-tag">2026 · 09—10</div><h2>照片突然多了起来。</h2><div class="photo-overlap">${img('thailand','泰国旅行 / 示意插画','','166px')}${img('airplane','回程飞机 / 示意插画','','166px')}</div></div>`,
    `${headerLine('TRAVEL, FOOD & SILLY JOY','18')}<div class="page-content"><h3>一起去过的地方，<br>一起浪费的时间。</h3><div class="chip-row"><span class="chip">曼谷</span><span class="chip">芭提雅</span><span class="chip">沙美岛</span><span class="chip">乱七八糟的小幸福</span></div><p>旅行、零食、游戏、开玩笑。相册越来越像一本随手贴起来的生活本。</p><div class="tile-row"><span class="tile">2</span><span class="tile">4</span><span class="tile">8</span><span class="tile">16</span></div><span class="hand-note">“又可以决战 2048 了！”</span>${foot('2048 已在客厅茶几上可玩，这里只留一小条回忆。')}</div>`];
  case 'proposal': return [
    `${headerLine('OCTOBER 03 · THE SECOND BLANK','19')}<div class="page-content"><div class="date-tag">2026 · 10.03</div>${blank('这一夜，没有录像。')}<div class="hand-note" style="align-self:center">就留在我们脑子里吧。</div></div>`,
    `${headerLine('THE MOMENT IS OURS','20')}<div class="page-content">${img('ring','戒指照片待替换 / 示意插画','3deg','179px')}<p>想记录生活的人，也会选择让某一个瞬间只存在于彼此的记忆里。</p><div class="quote" style="font-size:13px">“让我们的求婚被记忆不断地加工美化。”</div>${foot('求婚词取意自已有素材，正式文字待确认。')}</div>`];
  case 'marriage': return [
    `${headerLine('OCTOBER 19 · THE BRIGHT PAGE','21')}<div class="page-content"><div class="date-tag">2026 · 10.19</div><div class="wedding-banner"><div class="xi">囍</div><small>今天，我们结婚啦</small></div><p class="tiny-script" style="text-align:center">前一页没有照片。<br>这一页，终于有了。</p></div>`,
    `${headerLine('MARRIED · OUR LITTLE LIFE','22')}<div class="page-content"><h2>新婚那朝。</h2><p>下雨、放晴、赶路、聊天。连这样重要的日子，也有「待会儿吃麦当劳还是汉堡王」这样的琐碎。</p>${img('wedding','领证原图待替换 / 示意插画','2deg','166px')}<span class="hand-note" style="align-self:flex-end">怎么突然就是已婚人士啦。</span></div>`];
  case 'future': return [
    `${headerLine('EPILOGUE · THE THIRD BLANK','23')}<div class="page-content"><div class="date-tag">2027 · AND BEYOND</div>${blank('这里还没有照片。')}<p class="tiny-script" style="text-align:center">不是忘了拍。<br>是还没有走到那一天。</p></div>`,
    `${headerLine('TO BE CONTINUED','24')}<div class="page-content"><div class="hero-year" style="font-size:55px;margin:34px 0 7px">未完<br>待续。</div><p>我们以后还会有很多想要拍下来的日子，也会有很多来不及拍下来的幸福。</p><div class="future-lines"><svg viewBox="0 0 350 130"><path d="M8 38 Q110 65 160 62 T343 80" fill="none" stroke="#c6a279" stroke-width="3" stroke-dasharray="5 7"/><path d="M8 92 Q110 65 160 62 T343 54" fill="none" stroke="#c58b96" stroke-width="3" stroke-dasharray="5 7"/><text x="333" y="116" text-anchor="end" font-size="12" fill="#bba18a">……</text></svg></div>${foot('翻到最后，合上相册，就回到了我们的 3D 小屋。')}</div>`];
 }
 return ['',''];
}
function yearX(t){return 48+(Math.min(2027.5,Math.max(2016,t))-2016)*79.5}
function monthX(m){return 56+(Math.min(13,Math.max(1,m))-1)*73.4}
function starCount(n){return n<=4?1:n<=14?2:n<=29?3:n<=49?4:5}
function starClusterSvg(c,i){
 const x=yearX(c.time),y=56+(i%3-1)*1.6,n=starCount(c.count);
 const dots=Array.from({length:n},(_,j)=>{
   const a=j*2.3999632297+i*.72;
   const r=j===0?0:2.8+Math.sqrt(j)*3.8;
   const dx=Math.cos(a)*r,dy=Math.sin(a)*r*.72;
   const size=(j===0?2:1.15)+(c.count>=30?.3:0);
   return `<circle class="star-dot" cx="${(x+dx).toFixed(2)}" cy="${(y+dy).toFixed(2)}" r="${size}"/>`;
 }).join('');
 const halo=4+Math.sqrt(c.count)*.94;
 return `<g class="star-group" data-star="${i}" data-time="${c.time}" aria-label="${c.label}，有互动记录"><title>${c.label} · 朋友圈互动（按发布日期归档）</title><circle class="star-halo" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${halo.toFixed(1)}"/>${dots}</g>`;
}
function nodeSvg(p,i,x,y,opts=''){return `<g class="timeline-node ${p.draft?'draft':''} ${opts}" data-index="${i}" tabindex="0" role="button" aria-label="跳转 ${p.title}"><circle cx="${x.toFixed(1)}" cy="${y}" r="6.2"/><title>${p.date} · ${p.short}${p.draft?'（年份待确认）':''}</title></g>`}
function overviewSvg(){
 const stars=pastStarClusters.map((c,i)=>starClusterSvg(c,i)).join('');
 const nodes=pages.map((p,i)=>p.time<2026?nodeSvg(p,i,yearX(p.time),p.side==='fang'?31:p.kind==='guzheng'?79:55):'').join('');
 return `<svg viewBox="0 0 1000 123" preserveAspectRatio="none" aria-label="2016 到 2026 的双轨时间轴"><path d="M48 58 C87 58 92 31 130 31 L686 31 Q755 31 784 51 Q814 68 854 49 L962 47" stroke="#be9569" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M48 58 C87 58 92 83 130 83 L686 83 Q755 83 784 64 Q814 50 854 71 L962 73" stroke="#c7858f" stroke-width="3.5" fill="none" stroke-linecap="round"/>${stars}${nodes}${nodeSvg(pages[5],5,yearX(2026.05),58,'zoom-node')}<g class="time-pointer" id="overviewCursor"><line x1="0" y1="6" x2="0" y2="91"/><circle cx="0" cy="57" r="5.5"/></g><g class="timeline-ticks">${[2016,2017,2018,2020,2022,2024,2025,2026].map(y=>`<text x="${yearX(y)}" y="117" text-anchor="middle">${y}</text>`).join('')}</g></svg>`
}
function detailSvg(){
 const trackTop=[[1,43],[2,64],[3,43],[7,43],[9,62],[10,62],[11,48],[12,45],[13,43]];
 const bottom=[[1,82],[2,64],[3,88],[7,88],[9,62],[10,62],[11,78],[12,84],[13,86]];
 const points=(a)=>a.map(([m,y])=>`${monthX(m)},${y}`).join(' ');
 const nodes=pages.map((p,i)=>p.month?nodeSvg(p,i,monthX(p.month),p.kind==='firstmeet'||p.kind==='travel'||p.kind==='proposal'||p.kind==='marriage'?62:66):'').join('');
 return `<svg viewBox="0 0 1000 123" preserveAspectRatio="none" aria-label="2026 年月份放大时间轴"><polyline points="${points(trackTop)}" stroke="#be9569" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${points(bottom)}" stroke="#c7858f" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M${monthX(2)} 64L${monthX(2.25)} 64 M${monthX(9)} 62L${monthX(10.6)} 62" fill="none" stroke="#f0e3c7" stroke-width="2"/>${nodes}<g class="time-pointer" id="detailCursor"><line x1="0" y1="6" x2="0" y2="92"/><circle cx="0" cy="64" r="5.5"/></g><g class="timeline-ticks">${[1,2,3,5,7,9,10,11,12].map(m=>`<text x="${monthX(m)}" y="117" text-anchor="middle">${m}月</text>`).join('')}<text x="${monthX(13)}" y="117" text-anchor="middle">未来</text></g></svg>`
}
let pageIndex=0,turnBusy=false,curOverview=yearX(pages[0].time),curDetail=monthX(1),cursorFrame=0,starTimers=[];
function animateCursor(id,from,to){
 cancelAnimationFrame(cursorFrame);const el=$('#'+id);if(!el)return;const start=performance.now();
 function step(now){const t=Math.min(1,(now-start)/760),e=1-Math.pow(1-t,3);el.setAttribute('transform',`translate(${(from+(to-from)*e).toFixed(2)} 0)`);if(t<1)cursorFrame=requestAnimationFrame(step)}
 cursorFrame=requestAnimationFrame(step);
}
function flashStar(i){
 const n=document.querySelector(`[data-star="${i}"]`);
 if(n){n.classList.remove('flash');void n.getBoundingClientRect();n.classList.add('flash')}
}
function glintBetween(from,to){
 starTimers.forEach(clearTimeout);starTimers=[];
 if(from>=2026&&to>=2026)return;
 const relevant=pastStarClusters.map((c,i)=>({t:c.time,i})).filter(({t})=>t>=Math.min(from,to)&&t<=Math.max(from,to));
 if(to<from)relevant.reverse();
 relevant.forEach(({i},idx)=>starTimers.push(setTimeout(()=>flashStar(i),Math.round(idx*700/Math.max(relevant.length,1)))));
}
function renderIndex(){ $('#indexList').innerHTML=pages.map((p,i)=>`<button class="index-item ${i===pageIndex?'current':''}" data-jump="${i}"><small>${p.date}${p.draft?' · 示意定位':''}</small><b>${String(i+1).padStart(2,'0')}　${p.short}</b></button>`).join('');}
function render(immediate=false){
 const p=pages[pageIndex],parts=content(p),isDetail=p.time>=2026;
 $('#leftPage').innerHTML=parts[0];$('#rightPage').innerHTML=parts[1];
 $('#chapterTab').textContent=`CHAPTER ${String(pageIndex+1).padStart(2,'0')}`;
 $('#currentTitle').textContent=p.title;$('#currentTag').textContent=p.tag;
 $('#pageCount').textContent=`${String(pageIndex+1).padStart(2,'0')} / ${pages.length}`;$('#dateBadge').textContent=p.date;
 $('#prev').disabled=pageIndex===0;$('#next').disabled=pageIndex===pages.length-1;
 $('#zoomMode').textContent=isDetail?'2026 局部放大 · 月份 / 相聚':'十年远景 · 2016—2025';
 $('#overviewLayer').classList.toggle('active',!isDetail);$('#detailLayer').classList.toggle('active',isDetail);
 document.querySelectorAll('.timeline-node').forEach(n=>n.classList.toggle('active',Number(n.dataset.index)===pageIndex));
 if(immediate){$('#overviewCursor').setAttribute('transform',`translate(${curOverview} 0)`);$('#detailCursor').setAttribute('transform',`translate(${curDetail} 0)`)}
 renderIndex();
}
function go(next){
 if(turnBusy||next<0||next>=pages.length||next===pageIndex)return;
 const previous=pages[pageIndex],upcoming=pages[next];turnBusy=true;
 glintBetween(previous.time,upcoming.time);
 const newOverview=yearX(Math.min(upcoming.time,2026.07)),newDetail=monthX(upcoming.month||1);
 animateCursor(upcoming.time>=2026?'detailCursor':'overviewCursor',upcoming.time>=2026?curDetail:curOverview,upcoming.time>=2026?newDetail:newOverview);
 curOverview=newOverview;curDetail=newDetail;
 $('#spread').classList.add('is-turning');
 setTimeout(()=>{pageIndex=next;render(false)},170);
 setTimeout(()=>{$('#spread').classList.remove('is-turning');turnBusy=false},510);
}
function replayStars(){
 if(pages[pageIndex].time>=2026){go(4);setTimeout(()=>{if(pageIndex===4)replayStars()},700);return}
 starTimers.forEach(clearTimeout);starTimers=[];
 pastStarClusters.forEach((c,i)=>starTimers.push(setTimeout(()=>flashStar(i),i*95)));
}
$('#overviewLayer').innerHTML=overviewSvg();$('#detailLayer').innerHTML=detailSvg();
$('#prev').addEventListener('click',()=>go(pageIndex-1));$('#next').addEventListener('click',()=>go(pageIndex+1));
$('#indexOpen').addEventListener('click',()=>{$('#indexOverlay').classList.add('show');renderIndex()});
$('#indexClose').addEventListener('click',()=>$('#indexOverlay').classList.remove('show'));
$('#indexOverlay').addEventListener('click',(e)=>{if(e.target.id==='indexOverlay')$('#indexOverlay').classList.remove('show')});
$('#indexList').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;$('#indexOverlay').classList.remove('show');go(Number(b.dataset.jump))});
$('#starReplay').addEventListener('click',replayStars);
$('.timeline-view').addEventListener('click',e=>{const n=e.target.closest('[data-index]');if(n)go(Number(n.dataset.index))});
$('.timeline-view').addEventListener('keydown',e=>{const n=e.target.closest('[data-index]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(Number(n.dataset.index))}});
document.addEventListener('keydown',e=>{if($('#indexOverlay').classList.contains('show')){if(e.key==='Escape')$('#indexOverlay').classList.remove('show');return}if(e.key==='ArrowLeft')go(pageIndex-1);if(e.key==='ArrowRight')go(pageIndex+1)});
let touchX=null;$('#spread').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});$('#spread').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>60)go(pageIndex+(dx<0?1:-1));touchX=null},{passive:true});
render(true);
</script>
