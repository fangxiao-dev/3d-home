 else if(type==='sun'){ctx.arc(0,0,4.4,0,7);for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.moveTo(Math.cos(a)*7,Math.sin(a)*7);ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9)}}
 else if(type==='plane'){ctx.moveTo(-9,3);ctx.lineTo(9,-2);ctx.lineTo(-8,-5);ctx.lineTo(-4,-1);ctx.lineTo(-2,4);ctx.lineTo(1,6)}
 else if(type==='ring'){ctx.arc(0,2,6.3,0,7);ctx.moveTo(-3,-6);ctx.lineTo(0,-10);ctx.lineTo(4,-6);ctx.lineTo(0,-3);ctx.closePath()}
 else if(type==='certificate'){ctx.rect(-7,-7,14,14);ctx.moveTo(-4,-2);ctx.lineTo(4,-2);ctx.moveTo(-4,2);ctx.lineTo(1,2);ctx.moveTo(6,8);ctx.lineTo(9,11)}

 else {ctx.moveTo(0,-10);ctx.lineTo(2,-2);ctx.lineTo(9,0);ctx.lineTo(2,2);ctx.lineTo(0,10);ctx.lineTo(-2,2);ctx.lineTo(-9,0);ctx.lineTo(-2,-2);ctx.closePath()}
 ctx.stroke();ctx.restore();}
function historyNodes(g){album.pages.forEach((p,i)=>{if(p.time>=2026) return;const x=histX(p.time,g);const sides=p.side==='fang'?[-1]:p.side==='ying'?[1]:[-1,1];
  sides.forEach(s=>{const y=historyY(x,s,g),selected=index===i;ctx.fillStyle=selected?'#e9e6e3':'#253348';ctx.strokeStyle=s<0?'rgba(198,221,239,.9)':'rgba(224,185,214,.86)';ctx.lineWidth=selected?2.3:1.5;
    ctx.beginPath();ctx.arc(x,y,selected?5.3:4.5,0,7);ctx.fill();ctx.stroke();state.hits.push({x,y,index:i,label:p.date+' · '+p.short,clickable:true})})});}
function futureNodes(g,now){const nodes=album.pages.filter(p=>p.time>=2026),focus=state.focus;
 nodes.forEach(p=>{const i=album.pages.indexOf(p),x=futureX(p,g),ix=nodes.indexOf(p),y=g.y+(ix%2===0?-28:28),pathY=ribbonY(x,g),chosen=i===index;
  line([[x,pathY],[x,y<g.y?y+12:y-12]],'rgba(118,75,80,.38)',1.2);
  if(chosen)glow(x,y,24,'rgba(255,246,213,ALPHA)',.2);
  ctx.fillStyle=chosen?'#fff5e8':'#f7e8d9';ctx.strokeStyle=chosen?'#9b6474':'#bf8c8c';ctx.lineWidth=chosen?2:1.3;ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fill();ctx.stroke();drawSmallIcon(ICONS[p.id]||'sparkle',x,y,.78);
  state.hits.push({x,y,index:i,label:p.date+' · '+p.short,clickable:true})
 });
 // Traveling energy pulses for the currently selected icon; not a permanent marker.
 if(state.signalActive&&now>=state.signalStart){const age=now-state.signalStart,dur=reducedMotion?1:1100,t=clamp(age/dur,0,1);
  state.signalProgress=ease(t);
  const fromU=state.signalFrom?FUTURE_U[state.signalFrom]:0,toU=FUTURE_U[state.signalTarget],currentU=fromU+(toU-fromU)*state.signalProgress;
  for(const step of footsteps()){if(step.who!=='fang'||!step.page)continue;const u=FUTURE_U[step.page];if(u>=Math.min(fromU,currentU)-.00001&&u<=Math.max(fromU,currentU)+.00001)state.seenSteps.add(step.key);}
  if(t>=1){state.signalActive=false;state.flashAt=now}else{
  const to=futureX({id:state.signalTarget},g),from=state.signalFrom?futureX({id:state.signalFrom},g):g.end,x=from+(to-from)*ease(t),y=ribbonY(x,g);
  glow(x,y,22,'rgba(255,235,187,ALPHA)',.38);
  ctx.fillStyle='#fff6d1';ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();
  for(let j=1;j<4;j++){const xx=from+(to-from)*ease(clamp(t-j*.065,0,1));glow(xx,ribbonY(xx,g),9,'rgba(255,236,204,ALPHA)',.3-j*.045);ctx.fillStyle=`rgba(255,247,216,${.9-j*.16})`;ctx.beginPath();ctx.arc(xx,ribbonY(xx,g),2-j*.25,0,Math.PI*2);ctx.fill();}
 }}
 if(state.flashAt>0&&now-state.flashAt<550){const target=album.pages[index],x=futureX(target,g),i=nodes.indexOf(target),y=g.y+(i%2===0?-28:28);glow(x,y,17,'rgba(255,246,219,ALPHA)',.46*(1-(now-state.flashAt)/550))}
}
function wakeAndBoat(g,now,dt){const onWater=state.boatTime<2026;
 const bx=onWater?histX(state.boatTime,g):g.end+12,by=g.y+7+Math.sin(now*.002)*.6;
 if(onWater&&now<state.boatStart+state.boatDuration+30&&Math.abs(state.boatTo-state.boatFrom)>.001){for(let j=0;j<2;j++){state.wake.push({x:bx-6-rand(Math.floor(now+j))*6,y:by+(rand(Math.floor(now*2+j))-.5)*18,life:1,r:1.3+rand(j+Math.floor(now))*1.7})}}
 state.wake=state.wake.filter(p=>p.life>0);
 for(const p of state.wake){p.life-=dt*.00125;glow(p.x,p.y,p.r*8,'rgba(143,225,254,ALPHA)',.13*p.life);ctx.fillStyle=`rgba(194,243,255,${p.life*.64})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
 if(onWater){glow(bx,by+4,33,'rgba(115,222,248,ALPHA)',.23);
  for(let j=0;j<9;j++){const px=bx-20+rand(j*4+12)*32,py=by+(rand(j*7+19)-.5)*20;ctx.fillStyle=`rgba(199,246,253,${.2+.3*Math.sin((now*.003+j)*2)**2})`;ctx.beginPath();ctx.arc(px,py,.6+rand(j*3),0,7);ctx.fill()}
 }
 // hand-drawn little dark hull, just enough to recognize a boat
 ctx.save();ctx.translate(bx,by);ctx.fillStyle=onWater?'#263444':'#73565a';ctx.strokeStyle=onWater?'rgba(220,238,245,.9)':'rgba(255,239,213,.65)';ctx.lineWidth=1.1;
 ctx.beginPath();ctx.moveTo(-12,-1);ctx.quadraticCurveTo(0,2,12,-1);ctx.lineTo(8,5);ctx.quadraticCurveTo(0,9,-8,5);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-1,-2);ctx.lineTo(-1,-11);ctx.lineTo(6,-3);ctx.closePath();ctx.fill();ctx.restore();
}
function timeLabels(g){ctx.save();ctx.font='10px Georgia,serif';ctx.textBaseline='middle';ctx.fillStyle='rgba(243,238,228,.9)';
 let right=-Infinity;const reserve=g.start-ctx.measureText('2025 · 11月').width;
 for(const year of [2016,2018,2020,2022,2024]){const x=histX(year+.12,g)-9,width=ctx.measureText(String(year)).width;if(x<right+13||x+width>reserve-13)continue;ctx.fillText(String(year),x,g.h-12);right=x+width;}
 ctx.fillText('2025 · 11月',reserve,g.h-12);ctx.fillStyle='rgba(98,72,74,.88)';ctx.fillText('2026',g.end+4,g.h-12);
 ctx.restore();}
function draw(now){if(!state.active)return;const dt=Math.min(40,now-state.frameTime);state.frameTime=now;
 const f=smooth((now-state.animStart)/state.duration);state.focus=state.fromFocus+(state.targetFocus-state.fromFocus)*f;
 const t=smooth((now-state.boatStart)/state.boatDuration);state.boatTime=state.boatFrom+(state.boatTo-state.boatFrom)*t;
 const g=position();ctx.clearRect(0,0,g.w,g.h);state.hits=[];atmosphere(g);starRiver(g,now);historicalTracks(g);warmRibbon(g);historyNodes(g);futureNodes(g,now);drawFootsteps(g);wakeAndBoat(g,now,dt);timeLabels(g);
 requestAnimationFrame(draw);
}
function navigate(i,{immediate=false}={}){if(i<0||i>=album.pages.length)return;if(i===index&&!immediate)return;
 const prev=album.pages[index];index=i;const p=album.pages[i],now=performance.now();
 const newFocus=getFocus(i);state.fromFocus=state.focus;state.targetFocus=newFocus;state.animStart=now;state.duration=immediate||reducedMotion?1:1170;
 const toBoat=p.time>=2026?2026.01:p.time;state.boatFrom=state.boatTime;state.boatTo=toBoat;state.boatStart=now;state.boatDuration=immediate||reducedMotion?1:1000;
 if(p.time>=2026&&!immediate){state.signalFrom=prev.time>=2026?prev.id:null;state.signalTarget=p.id;state.signalProgress=0;state.signalActive=true;state.signalStart=now+(prev.time>=2026||reducedMotion?0:1000)}else state.signalActive=false;
 state.flashAt=-1;renderPage();}
function drawIndex(){const g=document.getElementById('index-grid');g.innerHTML=album.pages.map((p,i)=>`<button class="index-item" data-i="${i}"><small>${esc(p.date)}${p.draft?' · 年份待核实':''}</small><b>${String(i+1).padStart(2,'0')} · ${esc(p.short)}</b></button>`).join('');}
function replay(){const p=album.pages[index],now=performance.now();if(p.time>=2026){state.signalActive=true;state.signalStart=now;state.signalProgress=0;state.flashAt=-1;state.signalTarget=p.id;}else{state.boatFrom=2016.12;state.boatTo=p.time;state.boatTime=2016.12;state.boatStart=now;state.boatDuration=reducedMotion?1:1300;state.wake=[]}}
canvas.addEventListener('mousemove',ev=>{const r=canvas.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;hoverHit=state.hits.filter(p=>Math.hypot(p.x-x,p.y-y)<15).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(hoverHit){tooltip.style.display='block';tooltip.textContent=hoverHit.label;tooltip.style.left=Math.max(6,Math.min(bounds.w-230,x+12))+'px';tooltip.style.top=Math.max(4,y-40)+'px';canvas.style.cursor=hoverHit.clickable?'pointer':'help'}else{tooltip.style.display='none';canvas.style.cursor='crosshair'}});
canvas.addEventListener('mouseleave',()=>{tooltip.style.display='none';hoverHit=null});
canvas.addEventListener('click',ev=>{const r=canvas.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,h=state.hits.filter(h=>Math.hypot(h.x-x,h.y-y)<15).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(h?.clickable)navigate(h.index)});
