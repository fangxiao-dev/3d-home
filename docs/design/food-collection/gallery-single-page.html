<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一屏贴纸图鉴 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#e9e1d2;color:#49372a;font-family:"Microsoft YaHei",sans-serif}button{font:inherit}.sheet{position:relative;width:min(88vw,1100px,calc(84dvh * 1000 / 620));aspect-ratio:1000/620;border-radius:22px;background:#fff8e9;background-image:radial-gradient(ellipse at 20% 30%,#e9c78224,transparent 55%),radial-gradient(ellipse at 90% 80%,#e4c79a24,transparent 60%);box-shadow:0 14px 50px #5542261c;container-type:inline-size;transition:filter .2s,opacity .2s}header{position:absolute;left:4%;right:4%;top:4%;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}h1{margin:0;font-family:"KaiTi","STKaiti",serif;font-size:clamp(15px,2.6cqw,28px);letter-spacing:2px}header p{margin:0;font-size:clamp(9px,1.15cqw,13px);color:#a18a70}.food{position:absolute;display:block;padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-50%);border-radius:18px;isolation:isolate}.art{position:absolute;inset:0;transform:rotate(var(--angle));transition:transform .18s;pointer-events:none}.art img{position:absolute;max-width:none;pointer-events:none;filter:drop-shadow(1px 3px 1px #86664b19)}.food:hover .art,.food:focus-visible .art{transform:rotate(0deg) translateY(-4px)}.food:focus-visible{outline:2px dashed #ae784e;outline-offset:6px}.food .name{position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);padding:6px 11px;border-radius:7px;background:#5b4639;color:#fff8ed;font-size:clamp(10px,1.35cqw,15px);white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;z-index:4}.food[data-band="top"] .name{bottom:auto;top:calc(100% + 9px)}.food[data-band="bottom"] .name{bottom:auto;top:calc(100% + 9px)}.food:hover,.food:focus-visible{z-index:5}.food:hover .name,.food:focus-visible .name{opacity:1;visibility:visible}footer{position:absolute;bottom:2.3%;left:4%;right:4%;font-size:clamp(8px,1cqw,11px);color:#a28d76;display:flex;justify-content:space-between;pointer-events:none}body:has(dialog[open]) .sheet{filter:blur(7px);opacity:.6}dialog{padding:0;border:1px solid #d4bfa3;border-radius:22px;background:#fff8eb;color:#49372a;width:min(780px,88vw);max-height:86dvh;overflow:auto;box-shadow:0 24px 90px #38261e33}dialog::backdrop{background:#392d2440}.detail{display:grid;grid-template-columns:45fr 55fr;align-items:center;min-height:360px;padding:52px 35px 36px;gap:26px}.detail-image{width:100%;height:250px;object-fit:contain;filter:drop-shadow(2px 7px 3px #92714e14)}h2{font-family:"KaiTi","STKaiti",serif;font-size:30px;line-height:1.4;margin:12px 0 18px}.sample{font-size:12px;letter-spacing:2px;color:#a0805e}.description{font-size:16px;line-height:1.95;margin:0}.close{position:absolute;right:14px;top:12px;min-width:80px;min-height:36px;border:0;border-radius:20px;background:#eee1ca;color:#5d4938;cursor:pointer}.close:focus-visible{outline:3px solid #a57348;outline-offset:3px}.detail-note{font-size:11px;line-height:1.7;color:#a28d76;margin:22px 0 0}@media(max-width:600px){header p{display:none}dialog{width:90vw}.detail{grid-template-columns:1fr;padding:50px 24px 28px;gap:10px;min-height:0}.detail-image{height:180px}h2{font-size:24px;margin:8px 0 12px}.description{font-size:14px}.detail-note{margin-top:14px}.sheet{width:94vw}footer{font-size:8px}}@media(prefers-reduced-motion:reduce){.sheet,.art,.name{transition:none}}

/* Decorative ink stays behind the food and scales with the original collage. */
.doodles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:22px;overflow:hidden}
.doodles use{stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}
.doodles .gold{color:#e6b74f}.doodles .mint{color:#78ad96}.doodles .rose{color:#dca199}.doodles .blue{color:#8fb9c7}
</style></head><body>
<main class="sheet" aria-label="18 款美食贴纸图鉴"><svg class="doodles" viewBox="0 0 1000 620" aria-hidden="true" focusable="false">
<defs>

<g fill="#e5bf70" opacity=".48">
 <circle cx="253" cy="61" r="1.8"/><circle cx="392" cy="192" r="2"/><circle cx="612" cy="223" r="1.7"/>

</svg><header><h1></h1><p></p></header><p id="error" role="alert" hidden style="position:absolute;top:40%;left:10%;right:10%;color:#a02525;background:#fff;padding:1em;z-index:10"></p><div id="foods"></div><footer><span>一屏拼贴 · 交互原型</span><span>轻点食物，看看它的小介绍</span></footer></main>
<dialog aria-labelledby="detail-title" aria-describedby="detail-description"><button class="close" type="button" autofocus>关闭 ×</button><div class="detail"><img class="detail-image" alt=""><div><span class="sample">示意文案</span><h2 id="detail-title"></h2><p class="description" id="detail-description"></p><p class="detail-note">游戏式介绍示意，不是聊天原话。</p></div></div></dialog>
<script>
const base='/godot/content/food-collection/';
async function readJSON(path){const r=await fetch(base+path,{cache:'no-store'});if(!r.ok)throw new Error(path+' 读取失败（HTTP '+r.status+'）');try{return await r.json()}catch(e){throw new Error(path+' JSON 格式错误：'+e.message)}}
function showError(message){document.querySelector('#error').textContent='图鉴加载失败：'+message;document.querySelector('#error').hidden=false}
async function initialize(){
 const [content,layout]=await Promise.all([readJSON('content.json'),readJSON('layout-single-page.json')]);
 if(!Array.isArray(content.items)||!Array.isArray(layout))throw new Error('内容或布局不是有效数组');
 const byId=new Map(content.items.map(item=>[item.id,item]));
 if(byId.size!==content.items.length||layout.length!==byId.size||new Set(layout.map(item=>item.id)).size!==layout.length||layout.some(item=>!byId.has(item.id)))throw new Error('内容与布局 ID 不一致');
 document.querySelector('h1').textContent=content.title;document.querySelector('header p').textContent=content.subtitle;
 const foods=layout.map(pos=>({...pos,...byId.get(pos.id)}));
const imageBase=base+'images/';
const sheet=document.querySelector('.sheet'),host=document.querySelector('#foods'),dialog=document.querySelector('dialog');
let origin=null;
for(const item of foods){
 const button=document.createElement('button');button.type='button';button.className='food';button.dataset.band=item.band;button.setAttribute('aria-label',item.name);button.setAttribute('aria-haspopup','dialog');
 button.style.cssText=`left:${item.x/10}%;top:${item.y/6.2}%;width:${item.w/10}%;height:${item.h/6.2}%;--angle:${item.angle}deg`;
 const art=document.createElement('span');art.className='art';const image=document.createElement('img');image.src=imageBase+item.image;image.alt='';image.draggable=false;image.addEventListener('error',()=>showError('图片加载失败：'+item.image));
 const [x,y,w,h]=item.bounds;image.style.cssText=`width:${item.imageWidth/w*100}%;height:${item.imageHeight/h*100}%;left:${-x/w*100}%;top:${-y/h*100}%`;
 const name=document.createElement('span');name.className='name';name.textContent=item.name;art.append(image);button.append(art,name);
 button.addEventListener('click',()=>{origin=button;document.querySelector('.detail-image').src=imageBase+item.image;document.querySelector('.detail-image').alt=item.name;document.querySelector('#detail-title').textContent=item.name;document.querySelector('#detail-description').textContent=item.description;document.querySelector('.sample').hidden=!item.draft;document.querySelector('.detail-note').hidden=!item.draft;dialog.showModal();sheet.inert=true;});host.append(button);
}
document.querySelector('.close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});
dialog.addEventListener('close',()=>{sheet.inert=false;origin?.focus({preventScroll:true});});
dialog.addEventListener('keydown',event=>{if(event.key==='Tab'){event.preventDefault();document.querySelector('.close').focus();}});
}
initialize().catch(error=>showError(error.message));
</script></body></html>
